<defs><style>text{font-family:Arial,sans-serif;fill:#202a35}.title{font-size:38px;font-weight:bold;fill:#18334d}.box{fill:#f3f6f8;stroke:#205276;stroke-width:3}.ac{stroke:#c64e3b;stroke-width:7;fill:none}.dc{stroke:#dc751d;stroke-width:7;fill:none}.logic{stroke:#27845a;stroke-width:6;fill:none}.pe{stroke:#547b32;stroke-width:5;fill:none;stroke-dasharray:10 8}.label{font-size:22px;font-weight:bold}.small{font-size:17px;fill:#526270}</style></defs>
<rect width="1600" height="900" fill="#fff"/><text x="70" y="70" class="title">TEVO-BW · power and control architecture · concept A</text>
<rect x="70" y="150" width="250" height="130" rx="12" class="box"/><text x="95" y="205" class="label">AC INPUT</text><text x="95" y="242" class="small">switch · protection</text>
