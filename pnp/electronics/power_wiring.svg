<rect x="1190" y="405" width="320" height="125" rx="12" class="box"/><text x="1220" y="455" class="label">Feeder servos × 8</text><text x="1220" y="493" class="small">external rail, never USB</text>
<rect x="790" y="600" width="290" height="125" rx="12" class="box"/><text x="820" y="650" class="label">Official USB-C PSU</text><text x="820" y="688" class="small">5 V / 5 A · 27 W</text>
<rect x="1190" y="600" width="320" height="125" rx="12" class="box"/><text x="1220" y="650" class="label">Raspberry Pi 5</text><text x="1220" y="688" class="small">OpenPnP ARM64 camera gate</text>
