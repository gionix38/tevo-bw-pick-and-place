<text x="70" y="805" class="small">PE bonds to metal enclosure, door and PSU PE terminal. E-stop drops drive power/enable; SBC stays powered for logging.</text><text x="70" y="840" class="small">Concept only: select AC protection, DC fuses, wire gauge, terminals and contactor from verified load data and local code.</text>
