<rect x="790" y="145" width="290" height="130" rx="12" class="box"/><text x="820" y="200" class="label">24 V FUSED BUS</text><text x="820" y="240" class="small">branch protection per load</text>
<rect x="1190" y="80" width="320" height="125" rx="12" class="box"/><text x="1220" y="130" class="label">Motion board / drivers</text><text x="1220" y="168" class="small">24 V only if rated</text>
