<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs><style>text{font-family:Arial,sans-serif;fill:#202a35}.h{font-size:34px;font-weight:bold;fill:#18334d}.sh{font-size:23px;font-weight:bold;fill:#205276}.box{fill:#f5f7f8;stroke:#205276;stroke-width:3}.warn{fill:#fff1e0;stroke:#dc751d;stroke-width:3}.safe{fill:#eaf5ee;stroke:#27845a;stroke-width:3}.t{font-size:20px;font-weight:bold}.s{font-size:16px;fill:#526270}.usb{stroke:#276c99;stroke-width:5;fill:none}.pwr{stroke:#dc751d;stroke-width:5;fill:none}.sig{stroke:#27845a;stroke-width:4;fill:none}</style></defs>
<rect width="1600" height="1100" fill="white"/><text x="55" y="60" class="h">TEVO-BW · host, cameras and controller I/O</text>
<text x="55" y="115" class="sh">Recommended production topology: x86-64 OpenPnP host; Pi 5 is auxiliary until ARM support is qualified</text>
<rect x="55" y="175" width="330" height="190" rx="10" class="safe"/><text x="85" y="225" class="t">OpenPnP host</text><text x="85" y="260" class="s">x86-64 mini-PC recommended</text><text x="85" y="292" class="s">Linux 64-bit · official package</text><text x="85" y="324" class="s">USB ports + Ethernet</text>
<rect x="500" y="175" width="310" height="190" rx="10" class="box"/><text x="530" y="225" class="t">Powered USB hub*</text><text x="530" y="260" class="s">external certified supply</text><text x="530" y="292" class="s">camera data / USB 3.x</text><text x="530" y="324" class="s">avoid overload of host ports</text>
<rect x="940" y="125" width="270" height="125" rx="10" class="box"/><text x="970" y="172" class="t">Down camera</text><text x="970" y="210" class="s">UVC / MJPEG</text>
<rect x="940" y="290" width="270" height="125" rx="10" class="box"/><text x="970" y="337" class="t">Up camera</text><text x="970" y="375" class="s">UVC / MJPEG</text>
<rect x="500" y="480" width="310" height="145" rx="10" class="box"/><text x="530" y="528" class="t">USB serial motion board</text><text x="530" y="565" class="s">confirm VID/PID + protocol</text><text x="530" y="595" class="s">hardware DRIVER_EN / E-stop</text>
<rect x="940" y="480" width="270" height="145" rx="10" class="warn"/><text x="970" y="528" class="t">Arduino Nano</text><text x="970" y="565" class="s">feeder serial / firmware 3.0</text><text x="970" y="595" class="s">USB powers logic only</text>
<rect x="1300" y="455" width="250" height="200" rx="10" class="safe"/><text x="1325" y="500" class="t">8-lane servos</text><text x="1325" y="538" class="s">D2 → lane 1</text><text x="1325" y="568" class="s">D3..D8 → lanes 2..7</text><text x="1325" y="598" class="s">D9 → lane 8</text><text x="1325" y="628" class="s">external 5.0 V rail</text>
<path d="M385 235H500M810 220H875V188H940M875 188V353H940" class="usb"/><path d="M385 315H430V520H500M385 340H390V640H850V535H940" class="usb"/><path d="M1210 540H1300" class="sig"/><path d="M1210 586H1260V675H1300" class="pwr"/>
<rect x="55" y="480" width="330" height="145" rx="10" class="box"/><text x="85" y="528" class="t">Ethernet / LAN</text><text x="85" y="565" class="s">setup, logs, remote access</text><text x="85" y="595" class="s">wired network preferred</text><path d="M220 365V480" class="usb"/>
<rect x="55" y="720" width="470" height="150" rx="10" class="box"/><text x="85" y="770" class="t">USB identity checklist</text><text x="85" y="808" class="s">Record device serial / VID:PID and stable port name.</text><text x="85" y="840" class="s">Set camera devices by identity, not enumeration order.</text>
<rect x="570" y="720" width="470" height="150" rx="10" class="warn"/><text x="600" y="770" class="t">Bandwidth / power check</text><text x="600" y="808" class="s">Run both cameras concurrently at selected resolution/FPS.</text><text x="600" y="840" class="s">Check dropped frames, USB voltage and hub temperature.</text>
<rect x="1085" y="720" width="465" height="150" rx="10" class="safe"/><text x="1115" y="770" class="t">Pi 5 qualification gate</text><text x="1115" y="808" class="s">Official OpenPnP Linux package lists x86/x64, not ARM64.</text><text x="1115" y="840" class="s">Do not rely on Pi as production host before port testing.</text>
<text x="55" y="940" class="sh">Feeder USB and power separation</text><text x="55" y="985" class="s">Nano USB: host serial + logic VBUS → Nano only. DC/DC1 5 V: external servo V+ → shield servo rail only. Join signal GND to DC/DC return at the shield;</text><text x="55" y="1015" class="s">keep external servo V+ isolated from USB VBUS. Verify IO-shield jumper with a meter. *Powered hub is optional; verify its rating before use.</text>
</svg>
